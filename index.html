<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark light">
<meta name="description" content="Textile AI Audit System: root-cause control tower for large vertically integrated textile groups.">
<title>Textile AI Audit — Control Tower</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%238b9bff'/%3E%3Cstop offset='1' stop-color='%232dd4bf'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='32' height='32' rx='9' fill='url(%23g)'/%3E%3Cpath d='M8 21c4-9 12-9 16-10M8 15c4-4 9-5 16-4' stroke='%23fff' stroke-width='2.4' fill='none' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="stylesheet" href="css/styles.css">
<script src="js/theme.js"></script>
</head>
<body>
<a class="skip" href="#main">Skip to content</a>
<div class="bg" aria-hidden="true">
  <span class="blob b1"></span><span class="blob b2"></span><span class="blob b3"></span><span class="blob b4"></span>
  <div class="grid-bg"></div>
</div>

<div class="app">
  <aside class="side glass" id="side" aria-label="Main navigation">
    <div class="brand">
      <span class="logo" id="logo"></span>
      <div><b>Textile AI Audit</b><small>Root-cause control tower</small></div>
    </div>
    <nav class="nav" id="nav"></nav>
    <div class="side-foot">KPIs marked <b>Live</b> come from your data feed; others are baseline demo values (PKR).<br>Benchmarks from public research, labelled by confidence.</div>
  </aside>

  <div class="shell">
    <header class="top glass">
      <button class="btn icon ghost menu-btn" id="menuBtn" aria-label="Open menu" aria-controls="side" aria-expanded="false"></button>
      <div class="title"><div><span class="crumb" id="crumb"></span><h1 id="title">Command Center</h1></div></div>
      <div class="ctl">
        <button class="btn search-btn" id="searchBtn" aria-label="Search everything (Ctrl+K)"></button>
        <label class="sel" title="Plant"><span class="sr">Plant</span><span data-ic="factory"></span><select id="plantSel"></select></label>
        <label class="sel" title="Period"><span class="sr">Period</span><span data-ic="calendar"></span><select id="periodSel"></select></label>
        <button class="btn user-btn" id="userBtn" aria-haspopup="dialog" hidden></button>
        <button class="btn primary" id="scanBtn"></button>
        <button class="btn icon" id="themeBtn" aria-label="Switch light or dark theme"></button>
      </div>
    </header>
    <main id="main" tabindex="-1"></main>
  </div>
</div>

<div class="scrim" id="scrim"></div>
<aside class="drawer glass" id="drawer" role="dialog" aria-modal="true" aria-labelledby="drawerTitle"></aside>
<div class="palette glass" id="palette" role="dialog" aria-modal="true" aria-label="Search">
  <input type="search" id="pIn" placeholder="Search pages, KPIs, glossary terms, findings, calculators…" autocomplete="off" aria-controls="pList">
  <div class="p-list" id="pList" role="listbox"></div>
  <div class="p-foot"><span>↑↓ to move</span><span>Enter to open</span><span>Esc to close</span></div>
</div>
<div class="modal glass" id="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle"></div>
<div class="toasts" id="toasts" aria-live="polite"></div>
<div class="login" id="login" hidden></div>

<script src="js/engine.js"></script>
<script src="js/data.js"></script>
<script src="js/app.js"></script>
</body>
</html>
